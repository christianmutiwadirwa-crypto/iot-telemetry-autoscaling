apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: telemetry
data:
  timescaledb.yaml: |
    apiVersion: 1
    datasources:
      - name: TimescaleDB-Telemetry
        type: postgres
        access: proxy
        url: timescaledb-service.telemetry.svc.cluster.local:5432
        user: postgres
        database: telemetry
        isDefault: true
        jsonData:
          sslmode: disable
          postgresVersion: 1600
          timescaledb: true
        secureJsonData:
          password: postgrespassword

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: telemetry
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: "Telemetry Engine Dashboards"
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: telemetry
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.1
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: datasources-vol
              mountPath: /etc/grafana/provisioning/datasources/timescaledb.yaml
              subPath: timescaledb.yaml
            - name: dashboards-prov-vol
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboards-data-vol
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources-vol
          configMap:
            name: grafana-datasources
        - name: dashboards-prov-vol
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards-data-vol
          configMap:
            name: grafana-seismic-dashboard

---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: telemetry
  labels:
    app: grafana
spec:
  type: LoadBalancer
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: grafana
