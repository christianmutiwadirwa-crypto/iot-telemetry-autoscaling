# Local Kubernetes Cluster Configuration for 'kind' (Task L17)
# 3-Node Architecture: 1 Control-Plane + 2 Worker Nodes
# Exposes Ingest API (port 8000) and RabbitMQ Management (port 15672) to the host.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: telemetry-cluster
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Ingest API port mapping to host localhost:8000
      - containerPort: 30080
        hostPort: 8000
        protocol: TCP
      # RabbitMQ Management dashboard mapping to host localhost:15672
      - containerPort: 31672
        hostPort: 15672
        protocol: TCP
      # Processor metrics mapping to host localhost:8001
      - containerPort: 30081
        hostPort: 8001
        protocol: TCP

  - role: worker
    labels:
      node-type: compute-worker-1

  - role: worker
    labels:
      node-type: compute-worker-2
