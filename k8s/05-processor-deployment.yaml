apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
  namespace: telemetry
  labels:
    app: processor
    app.kubernetes.io/component: compute-layer
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: processor
  template:
    metadata:
      labels:
        app: processor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: processor
          image: processor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8001
          env:
            - name: METRICS_PORT
              value: "8001"
          envFrom:
            - configMapRef:
                name: telemetry-config
            - secretRef:
                name: telemetry-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

---
apiVersion: v1
kind: Service
metadata:
  name: processor-service
  namespace: telemetry
  labels:
    app: processor
spec:
  type: NodePort
  selector:
    app: processor
  ports:
    - name: metrics
      port: 8001
      targetPort: 8001
      nodePort: 30081
