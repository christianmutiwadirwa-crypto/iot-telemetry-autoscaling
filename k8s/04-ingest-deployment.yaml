apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-api
  namespace: telemetry
  labels:
    app: ingest-api
    app.kubernetes.io/component: ingestion-layer
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ingest-api
  template:
    metadata:
      labels:
        app: ingest-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: ingest-api
          image: ingest-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
          envFrom:
            - configMapRef:
                name: telemetry-config
            - secretRef:
                name: telemetry-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

---
apiVersion: v1
kind: Service
metadata:
  name: ingest-api-service
  namespace: telemetry
  labels:
    app: ingest-api
spec:
  type: NodePort
  selector:
    app: ingest-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
