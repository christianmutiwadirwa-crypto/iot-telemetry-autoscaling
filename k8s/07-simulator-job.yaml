apiVersion: batch/v1
kind: Job
metadata:
  name: fleet-simulator-loadtest
  namespace: telemetry
  labels:
    app: fleet-simulator
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: fleet-simulator
    spec:
      restartPolicy: Never
      containers:
        - name: simulator
          image: python:3.12-slim
          command: ["/bin/bash", "-c"]
          args:
            - |
              pip install aiohttp
              cat << 'EOF' > run_burst.py
              import asyncio, aiohttp, time, uuid, os

              INGEST_URL = os.getenv("INGEST_URL", "http://ingest-api-service.telemetry.svc.cluster.local:8000/api/v1/telemetry")
              API_KEY = "dev-secret-key-123"

              async def send_batch(session, node_id, is_quake=False):
                  payload_type = "waveform" if is_quake else "summary"
                  payload = {
                      "batch_id": str(uuid.uuid4()),
                      "device_id": f"seismic-node-{node_id:03d}",
                      "sector": "A",
                      "measured_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                      "sent_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                      "is_backfill": False,
                      "payload_type": payload_type
                  }
                  if is_quake:
                      payload["waveform"] = {
                          "sampling_rate_hz": 1000,
                          "samples": [[0.05, 0.02, 0.01]] * 100
                      }
                  else:
                      payload["summary"] = {
                          "interval_seconds": 60.0,
                          "peak_acceleration_g": 0.015,
                          "rms_acceleration_g": 0.008,
                          "sample_count": 60000,
                          "temperature_c": 22.4
                      }

                  headers = {"Content-Type": "application/json", "X-Device-API-Key": API_KEY}
                  try:
                      async with session.post(INGEST_URL, json=payload, headers=headers, timeout=5) as res:
                          return res.status
                  except Exception as e:
                      return 500

              async def main():
                  print(f"Starting in-cluster high-throughput burst to {INGEST_URL}...")
                  async with aiohttp.ClientSession() as session:
                      # 1. Quake burst across 500 nodes (10 waves)
                      for wave in range(10):
                          tasks = [send_batch(session, i, is_quake=True) for i in range(1, 501)]
                          results = await asyncio.gather(*tasks)
                          success = results.count(202)
                          print(f"Wave {wave+1}/10: Sent 500 batches, {success} accepted (202).")
                          await asyncio.sleep(0.5)

              asyncio.run(main())
              EOF
              python run_burst.py
          env:
            - name: INGEST_URL
              value: "http://ingest-api-service.telemetry.svc.cluster.local:8000/api/v1/telemetry"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
